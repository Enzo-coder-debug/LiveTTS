name: Deploy LiveTTS research page

on:
  push:
    branches: [main]
    paths:
      - livetts-github/**
      - .github/workflows/livetts-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livetts-pages
  cancel-in-progress: false

env:
  SITE_DIR: livetts-github

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate website
        run: node "$SITE_DIR/scripts/validate.mjs"
      - name: Stage public files only
        run: |
          mkdir -p "$RUNNER_TEMP/livetts-site"
          cp "$SITE_DIR/index.html" "$SITE_DIR/site.config.js" "$SITE_DIR/data.js" "$SITE_DIR/MODEL_CARD.md" "$SITE_DIR/README.md" "$SITE_DIR/.nojekyll" "$RUNNER_TEMP/livetts-site/"
          cp -R "$SITE_DIR/assets" "$RUNNER_TEMP/livetts-site/assets"
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/livetts-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
